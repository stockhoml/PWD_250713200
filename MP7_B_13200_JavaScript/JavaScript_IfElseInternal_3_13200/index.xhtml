    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <script type="text/javascript">
        var iBerta;
        var sEkspres;

        iBerat = prompt("Masukkan berat paket (kg).", 0);
        sEkpres = prompt("Pakai pengiriman ekspress? (Y)a atau (T)idak", "T");

        if(iBerat>5){
            if(sEkpres=="Y"){
                alert("Ongkir Rp 50.000 (ekspres)");
            }else{
                alert("Ongkir Rp 30.000 (reguler)");
            }
        }else{
            if(sEkpres == "Y"){
                alert("Ongkir Rp 25.000 (ekspress)");
            }else{
                alert("Ongkir Rp 12.00 (reguler)");
            }
        }
    </script>
